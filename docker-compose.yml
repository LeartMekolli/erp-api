# Fixed so the stack has one identity whichever directory or symlink it is
# started from; otherwise each checkout gets its own containers and volume.
name: erp-api

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d erp']
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Catches every email sent locally. Web UI and API at http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      retries: 10

volumes:
  pgdata:
