# Fixed so the stack has one identity whichever directory or symlink it is
# started from; otherwise each checkout gets its own containers and volume.
name: erp-api

# The application's settings inside Compose: the same values as .env.example,
# with service names instead of localhost.
x-app-environment: &app-environment
  NODE_ENV: development
  PORT: '3000'
  DATABASE_URL: postgresql://erp_app:app_pw@postgres:5432/erp?schema=public
  DATABASE_MIGRATE_URL: postgresql://erp_owner:owner_pw@postgres:5432/erp?schema=public
  REDIS_URL: redis://redis:6379
  APP_SECRET: development_secret_at_least_32_chars
  JWT_SECRET: development_jwt_secret_at_least_32_chars
  APP_BASE_DOMAIN: localhost
  LOG_LEVEL: info
  QUEUE_PREFIX: erp
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: ERP <no-reply@example.test>
  WEB_URL_TEMPLATE: http://{tenant}.localhost:5173
  S3_ENDPOINT: http://minio:9000
  # Signed upload and download links are for the browser, which reaches MinIO here.
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: auto
  S3_BUCKET: erp-files
  S3_ACCESS_KEY_ID: minio
  S3_SECRET_ACCESS_KEY: minio-password
  S3_FORCE_PATH_STYLE: 'true'

x-app-depends-on: &app-depends-on
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  mailpit:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d erp']
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Catches every email sent locally. Web UI and API at http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      retries: 10

  # Stands in for Cloudflare R2 locally and in CI. MinIO no longer publishes
  # images, so this is Chainguard's rebuild of it, pinned by digest so it only
  # changes when we choose (pull a newer latest and replace the digest). Console at
  # http://localhost:9001 (minio / minio-password).
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:2915cb406f38ed6ff9634de0a3e4a9423e2dda06a6f1aca18f8c968aa37a01f6
    command: ['server', '/home/nonroot/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-password
    ports: ['9000:9000', '9001:9001']
    volumes:
      # The image runs as a non-root user that owns /home/nonroot; a new volume
      # mounted there inherits that ownership, so MinIO can write to it.
      - miniodata:/home/nonroot

  # Waits for MinIO, creates the private bucket once, then exits. The
  # application never creates buckets, and none is ever made public. The -dev
  # variant carries the shell the wait loop needs.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:f4ffdb6d79586e6255d138641ab5e6b0dca8f188df4291fd62a3278785bbe468
    entrypoint: ['sh', '-c']
    command:
      - |
        until mc alias set local http://minio:9000 minio minio-password >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing local/erp-files
    depends_on:
      - minio

  # The application itself, only with `--profile app`. Without the profile,
  # `docker compose up` starts the infrastructure alone and `npm run start:dev`
  # keeps port 3000.

  # Applies migrations and seeds, then exits; api and worker wait for it.
  migrate:
    profiles: [app]
    build:
      context: .
      target: build
    command: ['sh', '-c', 'npx prisma migrate deploy && node dist/cli/seed.js']
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  api:
    profiles: [app]
    build: .
    command: ['node', 'dist/main']
    environment: *app-environment
    ports: ['3000:3000']
    depends_on: *app-depends-on
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      retries: 10

  # Runs the jobs; serves no HTTP.
  worker:
    profiles: [app]
    build: .
    command: ['node', 'dist/worker']
    environment: *app-environment
    depends_on: *app-depends-on

volumes:
  pgdata:
  miniodata:
